<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="description" content="Bootstrap Admin App">
    <meta name="keywords" content="app, responsive, jquery, bootstrap, dashboard, admin">
    <link rel="icon" type="image/x-icon" href="{% static 'logo-single.ico' %}">
    <!-- =============== VENDOR STYLES ===============-->
    <!-- FONT AWESOME-->
    <link rel="stylesheet" href="{% static 'vendor/@fortawesome/fontawesome-free/css/brands.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/@fortawesome/fontawesome-free/css/regular.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/@fortawesome/fontawesome-free/css/solid.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/@fortawesome/fontawesome-free/css/fontawesome.css' %}">
    <!-- SIMPLE LINE ICONS-->
    <link rel="stylesheet" href="{% static 'vendor/simple-line-icons/css/simple-line-icons.css' %}"><!-- ANIMATE.CSS-->
    <link rel="stylesheet" href="{% static 'vendor/animate.css/animate.css' %}"><!-- WHIRL (spinners)-->
    <link rel="stylesheet" href="{% static 'vendor/whirl/dist/whirl.css' %}">
    <!-- =============== PAGE VENDOR STYLES ===============-->
    <!-- =============== BOOTSTRAP STYLES ==========s=====-->
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}" id="bscss">
    <!-- =============== APP STYLES ===============-->
    <link rel="stylesheet" href="{% static 'css/app.css' %}" id="maincss">
    <link rel="stylesheet" href="{% static 'css/grade-radial.css' %}" id= "radialcss">
    <link rel="stylesheet" href="{% static 'css/custom/flashcard.css' %}" id= "flashcard">
    <link rel="stylesheet" href="{% static 'css/custom/search-nav.css' %}" id= "search-nav">

    <title>{{ page_name }}</title>
</head>

<body style="background-color: #fff">
<div class="wrapper">
    <!-- Top Navbar -->
    {% include 'layout/../block/top-navbar.html' %}

    <section class="section-container" style="margin-left: 0">
        <!-- Page content -->
        <div class="content-wrapper homepage-specific-animation" style="background-color: transparent; border: none">
            {% block content %}
            {% endblock %}
        </div>
    </section>

    <!-- Page footer -->
    <footer class="footer-container"><span>&copy; 2024 - Hanja Hero</span></footer>
</div>

{% include 'layout/../block/test_option_modal.html' %}


<!-- MODERNIZR-->
<script src="{% static 'vendor/modernizr/modernizr.custom.js' %}"></script><!-- STORAGE API-->
<script src="{% static 'vendor/js-storage/js.storage.js' %}"></script><!-- SCREENFULL-->
<script src="{% static 'vendor/screenfull/dist/screenfull.js' %}"></script><!-- i18next-->
<script src="{% static 'vendor/i18next/i18next.js' %}"></script>
<script src="{% static 'vendor/i18next-xhr-backend/i18nextXHRBackend.js' %}"></script>
<script src="{% static 'vendor/jquery/dist/jquery.js' %}"></script>
<script src="{% static 'vendor/popper.js/dist/umd/popper.js' %}"></script>
<script src="{% static 'vendor/bootstrap/dist/js/bootstrap.js' %}"></script>
<!-- =============== PAGE VENDOR SCRIPTS ===============-->
<!-- =============== APP SCRIPTS ===============-->
<script src="{% static 'js/app.js' %}"></script>
<script src="{% static 'js/time-limit-option.js' %}"></script>
<script src="{% static 'js/constants.js' %}"></script>
<script src="{% static 'js/exam-card.js' %}"></script>
<script src="{% static 'js/modal.js' %}"></script>
<script src="{% static 'js/link-generation.js' %}"></script>
<script src="{% static 'js/save-test-info.js' %}"></script>
<script src="{% static 'js/flashcard.js' %}"></script>
<script src="{% static 'js/search-nav.js' %}"></script>
<script src="{% static 'https://code.jquery.com/jquery-3.5.1.slim.min.js' %}"></script>
<script src="{% static 'https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js' %}"></script>
<script src="{% static 'https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js' %}"></script>





</body>

</html>
